; MVP process supervision: php-fpm + the Laravel queue workers + cron (scheduler),
; all in the one php-fpm container with supervisord as PID 1. This is a deliberate
; convenience — see rominas-deployment/README.md for the anti-pattern and the
; container-native way (one process per service).

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Control socket so `supervisorctl status/restart` works inside the container.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
; Let an in-flight job finish on `docker stop` instead of being killed mid-run.
stopsignal=SIGTERM
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Voting workers (config/voting.php `queues`): IssueVotingLinkJob (e-mail validation + ballot) and the
; link e-mails. `voting-mail` is listed first, so a voter whose address passed gets the e-mail before new
; checks start. A check holds a worker for as long as ZeroBounce takes (~1 s), so 8 workers clear roughly
; 6–7 link requests/s; a burst above that waits in the queue. Their jobs are capped at 60 s (below the
; database queue's retry_after of 90), so a stop never waits long.
[program:laravel-worker-voting]
command=php /var/www/html/artisan queue:work --queue=voting-mail,voting-validation --sleep=1 --tries=3 --timeout=60 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=8
user=www-data
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
