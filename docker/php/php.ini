[PHP]
memory_limit = 256M
; The API takes JSON only (no file uploads), so request bodies stay small.
upload_max_filesize = 2M
post_max_size = 2M
max_execution_time = 60
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Images are immutable — never stat files for changes; rebuild the image to ship code.
opcache.validate_timestamps = 0
