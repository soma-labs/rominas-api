; php-fpm pool for the API (copied to /usr/local/etc/php-fpm.d/zzz-rominas.conf; loads after the image's
; www.conf / zz-docker.conf, so these values win). The image default of 5 children stalled the whole API
; at ~4 link requests/s in the 2026-11-11 load test; 20 children took 60 req/s once the link request no
; longer waited on ZeroBounce, at about 150 MiB in total. Size it with Server A's memory in mind.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 1000
; Matches php.ini max_execution_time.
request_terminate_timeout = 60s
